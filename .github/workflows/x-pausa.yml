name: X - Pausa (niente Issue)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: x-stato
  cancel-in-progress: false
jobs:
  stato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '{"attivo": false, "aggiornato": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > x_stato.json
          cat x_stato.json
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add x_stato.json
          git commit -m "Proposte X in pausa" || echo "Nessuna modifica"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
