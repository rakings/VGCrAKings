name: Locali - notifica nuova top 8
on:
  push:
    branches: [main]
    paths: [locali.json, annunci.json]
permissions:
  contents: write
  issues: write
concurrency:
  group: locali-notifica
  cancel-in-progress: false
jobs:
  notifica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Attesa di 3 minuti (se nel frattempo metti "rimosso" la notifica non parte)
        run: sleep 180
      - uses: actions/checkout@v4
      - run: python3 -u locali_notifica.py
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SUBS_URL: ${{ vars.SUBS_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - name: Salva stato e cronologia
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f locali_state.json ] && git add locali_state.json
          [ -f notifiche_avvisi.json ] && git add notifiche_avvisi.json
          git diff --staged --quiet || (git commit -m "Locali: notifica inviata" && git pull --rebase && git push)
