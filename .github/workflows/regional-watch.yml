name: Regionali - controllo iscrizioni RK9
on:
  schedule:
    # 6 letture al giorno (RK9 + Victory Road). Ora italiana invernale (d'estate +1 ora):
    #   08:14, 11:52, 16:21, 20:43  -> giornata europea
    #   23:37, 02:31                -> pomeriggio/sera americani: annunci USA prima delle aperture notturne (19:00 ora USA = 03:00-04:00 da noi)
    - cron: "14 7 * * *"
    - cron: "52 10 * * *"
    - cron: "21 15 * * *"
    - cron: "43 19 * * *"
    - cron: "37 22 * * *"
    - cron: "31 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: regional-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u regional_watch.py check
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SUBS_URL: ${{ vars.SUBS_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f regional_watch_state.json ] && git add regional_watch_state.json
          [ -f notifiche_avvisi.json ] && git add notifiche_avvisi.json
          git diff --staged --quiet && exit 0
          git commit -m "Regionali: iscrizioni RK9"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
