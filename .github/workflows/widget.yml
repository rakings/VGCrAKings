name: Widget - dati per l'app
# Parte DA SOLO ogni ora (e quando cambiano tornei, annunci o questo file): prepara widget.json, il file piccolo che leggono i widget dell'app Android,
# e report.json (sezione Report di Altopiano Blu: si aggiorna da solo quando finisce un torneo, vgcstats/index.json).
on:
  push:
    branches: [main]
    paths: ["events.json", "annunci.json", "locali.json", "vgcstats/index.json", "widget_data.py", "report_data.py", ".github/workflows/widget.yml"]
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget
  cancel-in-progress: false
jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u widget_data.py
      - run: python -u report_data.py
      - name: Salva su GitHub (solo se cambiato)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add widget.json
          if [ -f report.json ]; then git add report.json; fi
          if [ -f report_top.json ]; then git add report_top.json; fi
          if [ -f widget_usage.json ]; then git add widget_usage.json; fi
          if ! git diff --staged --quiet; then
            git commit -m "Widget: dati aggiornati"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 6
            done
          fi
