name: Aggiorna tornei
on:
  # Niente orari di GitHub: lo fa partire il Worker di Cloudflare 12 volte al giorno (TORNEI_ORARI in cloudflare/worker.js),
  # perche' GitHub i giri programmati li salta o li ritarda. Si puo' sempre avviare anche a mano.
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write      # solo per far partire «Social» alla fine (ultimo passo)
# lo fa partire il Worker 12 volte al giorno: due giri non devono mai sovrapporsi (avvisi doppi)
concurrency:
  group: tornei
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Attesa casuale (da 0 a 4 minuti dopo l'orario programmato)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 240))
      - uses: actions/checkout@v4
      - run: python3 update_events.py
        env:
          LIMITLESS_KEY: ${{ secrets.LIMITLESS_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SUBS_URL: ${{ vars.SUBS_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - run: python3 update_news.py
        continue-on-error: true
        env:
          NEWS_BOT: ${{ vars.NEWS_BOT || '1' }}
      - run: python3 -u notify_players.py
        continue-on-error: true
        timeout-minutes: 3
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SUBS_URL: ${{ vars.SUBS_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - run: pip install pillow
        continue-on-error: true
      - run: python3 make_share_pages.py
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          [ -d e ] && git add -A e
          [ -f news.json ] && git add news.json
          [ -f news_vr.json ] && git add news_vr.json
          [ -f notify_state.json ] && git add notify_state.json
          [ -f notify_players_state.json ] && git add notify_players_state.json
          [ -f notifiche_avvisi.json ] && git add notifiche_avvisi.json
          [ -f news_cache.json ] && git add news_cache.json
          git diff --staged --quiet && exit 0
          git commit -m "Aggiorna tornei"
          # con i Regionali in diretta altri flussi salvano nello stesso momento: si riprova invece di fallire
          for i in 1 2 3 4; do git pull --rebase --autostash -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 6; done
          exit 1
      # finito l'aggiornamento dei tornei parte «Social» (prepara i post con i tornei appena aggiornati): una sola chiamata dal Worker basta per tutti e due
      - name: Fa partire Social
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run social.yml --ref main --repo "$GITHUB_REPOSITORY"
