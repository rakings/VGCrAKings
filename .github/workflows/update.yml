name: Aggiorna tornei
on:
  schedule:
    # 15 aggiornamenti al giorno, volutamente irregolari: più radi di notte, più fitti a pranzo, nel pomeriggio e la sera
    # (18:31-20:19 = iscrizioni dei Regionali italiani). Gli orari di GitHub sono in UTC: in inverno cadono un'ora prima.
    - cron: "7 22 * * *"   # 00:07 ora italiana (estiva)
    - cron: "34 0 * * *"   # 02:34 ora italiana (estiva)
    - cron: "3 3 * * *"   # 05:03 ora italiana (estiva)
    - cron: "19 5 * * *"   # 07:19 ora italiana (estiva)
    - cron: "2 7 * * *"   # 09:02 ora italiana (estiva)
    - cron: "41 8 * * *"   # 10:41 ora italiana (estiva)
    - cron: "17 10 * * *"   # 12:17 ora italiana (estiva)
    - cron: "26 11 * * *"   # 13:26 ora italiana (estiva)
    - cron: "52 12 * * *"   # 14:52 ora italiana (estiva)
    - cron: "18 14 * * *"   # 16:18 ora italiana (estiva)
    - cron: "27 15 * * *"   # 17:27 ora italiana (estiva)
    - cron: "31 16 * * *"   # 18:31 ora italiana (estiva)
    - cron: "22 17 * * *"   # 19:22 ora italiana (estiva)
    - cron: "19 18 * * *"   # 20:19 ora italiana (estiva)
    - cron: "52 19 * * *"   # 21:52 ora italiana (estiva)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Attesa casuale (da 0 a 4 minuti dopo l'orario programmato)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 240))
      - uses: actions/checkout@v4
      - run: python3 update_events.py
        env:
          LIMITLESS_KEY: ${{ secrets.LIMITLESS_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SUBS_URL: ${{ vars.SUBS_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - run: python3 update_news.py
        continue-on-error: true
        env:
          NEWS_BOT: ${{ vars.NEWS_BOT || '1' }}
      - run: python3 -u notify_players.py
        continue-on-error: true
        timeout-minutes: 3
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SUBS_URL: ${{ vars.SUBS_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - run: pip install pillow
        continue-on-error: true
      - run: python3 make_share_pages.py
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_ISSUES: ${{ vars.X_ISSUES }}
          X_REPO: ${{ vars.X_REPO }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          [ -d e ] && git add -A e
          [ -f news.json ] && git add news.json
          [ -f news_vr.json ] && git add news_vr.json
          [ -f notify_state.json ] && git add notify_state.json
          [ -f notify_players_state.json ] && git add notify_players_state.json
          [ -f notifiche_avvisi.json ] && git add notifiche_avvisi.json
          [ -f news_cache.json ] && git add news_cache.json
          git diff --staged --quiet || (git commit -m "Aggiorna tornei" && git pull --rebase && git push)
