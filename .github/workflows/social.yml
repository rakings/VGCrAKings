name: Social - prepara i post
# Parte DA SOLO: quando un locale viene pubblicato sul sito (cambia locali.json), ogni ora (money tournament del lunedi', VR, Regionali) e al caricamento di questo file.
# Prepara immagine + testi per Instagram e X: li approvi dalla tua pagina admin (schede Instagram e X).
on:
  push:
    branches: [main]
    paths: ["locali.json", ".github/workflows/social.yml", "social.py", "social_img.py", "bric.ttf", "RussoOne-Regular.ttf", "ChakraPetch-Bold.ttf", "Bungee-Regular.ttf", "caratteri/**"]
  schedule:
    # riserva se il Worker non partisse (il Worker lo fa partire 18 volte al giorno, 8:30-21:30): 4 volte al giorno al minuto 32,
    # solo di giorno: 8:32, 12:32, 16:32, 20:32 ora italiana d'inverno (un'ora dopo con l'ora legale). Orari di GitHub in UTC.
    - cron: "32 7-19/4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social
  cancel-in-progress: false
jobs:
  crea:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - id: crea
        run: python -u social.py crea
        env:
          BACKUP_CHIAVE: ${{ secrets.BACKUP_CHIAVE }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HOST: ${{ vars.IG_HOST }}
          IG_API_VER: ${{ vars.IG_API_VER }}
      - name: Salva su GitHub (solo se cambiato)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A social
          if ! git diff --staged --quiet; then
            git commit -m "Social: richieste aggiornate"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 6
            done
          fi
