name: VGC Stats - raccolta dati (Pokedata)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "elenco = elenco dei regionali - evento = un solo regionale - auto = in corso e finiti da raccogliere - live = controlli ripetuti finche' un regionale e' in corso"
        required: true
        default: "elenco"
        type: choice
        options:
          - "elenco"
          - "evento"
          - "auto"
          - "live"
      id:
        description: "Solo per modo evento: id Pokedata del regionale (Nizza: 1000076)"
        required: false
        default: "1000076"
      salva:
        description: "no = solo prova, non salva nulla - si = salva i file in vgcstats/"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "si"
  # --- Aggiornamento automatico: ATTIVO. Per spegnerlo metti un # davanti alle righe "cron". ---
  # Orari in UTC. Ora italiana invernale (fino a fine marzo) = UTC + 1; con l'ora legale = UTC + 2.
  # Minuti 07 e 37 (non 00 e 30): a inizio ora GitHub e' piu' carico e ritarda di piu'.
  schedule:
    # LIVE sabato-lunedi: un controllo ogni 45 minuti (00:07, 00:52, 01:37, 02:22, 03:07... ogni 3 ore si ripete).
    # Se c'e' un regionale in corso resta attivo con controlli a intervalli casuali di 8-16 minuti; se non c'e', si ferma subito.
    - cron: "7 0-23/3 * * 6,0,1"
    - cron: "52 0-23/3 * * 6,0,1"
    - cron: "37 1-23/3 * * 6,0,1"
    - cron: "22 2-23/3 * * 6,0,1"
    # Recupero squadre (solo se mancano) - ora italiana invernale:
    - cron: "7,37 17-23 * * *"      # sera 18:07 - 00:37
    - cron: "7,37 0 * * *"          # 01:07 e 01:37
    - cron: "7 5 * * *"             # 06:07 (anche regionali finiti e nuovi)
    - cron: "7 9,11,13 * * *"       # 10:07, 12:07 e 14:07
permissions:
  contents: write
concurrency:
  group: vgc-stats
  cancel-in-progress: false
jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODO: ${{ inputs.modo || (endsWith(github.event.schedule, ' 6,0,1') && 'live' || 'auto') }}
      TORNEO: ${{ inputs.id }}
      SALVA: ${{ github.event_name == 'schedule' && 'si' || inputs.salva }}
    steps:
      - uses: actions/checkout@v4
      - name: Raccolta
        run: |
          W=""
          [ "$SALVA" = "si" ] && W="--write"
          case "$MODO" in
            elenco) python3 -u vgc_stats.py --list $W ;;
            evento) python3 -u vgc_stats.py --id "$TORNEO" $W ;;
            live)   if [ "$SALVA" = "si" ]; then python3 -u vgc_stats.py --live --write --commit; else python3 -u vgc_stats.py --live --max-cycles 1; fi ;;
            *)      python3 -u vgc_stats.py --auto $W ;;
          esac
      - name: Salva i file nella repo
        if: ${{ always() && (github.event_name == 'schedule' || inputs.salva == 'si') }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          [ -d vgcstats ] && git add -A vgcstats
          git diff --staged --quiet || (git commit -m "VGC Stats: aggiornamento dati" && git pull --rebase && git push)
