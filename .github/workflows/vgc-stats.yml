name: VGC Stats - raccolta dati (Pokedata)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "elenco = elenco di tutti i regionali - evento = un solo regionale - auto = quelli in corso e quelli finiti non ancora raccolti"
        required: true
        default: "elenco"
        type: choice
        options:
          - "elenco"
          - "evento"
          - "auto"
      id:
        description: "Solo per modo evento: id Pokedata del regionale (Nizza: 1000076)"
        required: false
        default: "1000076"
      salva:
        description: "no = solo prova, non salva nulla - si = salva i file in vgcstats/"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "si"
  # --- Aggiornamento automatico: ATTIVO. Per spegnerlo metti un # davanti alle righe "cron". ---
  # Orari in UTC. Ora italiana invernale (fino a fine marzo) = UTC + 1; da fine marzo (ora legale) = UTC + 2.
  # Minuti 07 e 37 (non 00 e 30): a inizio ora GitHub e' piu' carico e ritarda di piu'.
  schedule:
    - cron: "7,37 17-23 * * 5,6,0"   # venerdi-domenica, ogni mezz'ora: 18:07 - 00:37 ora italiana (14 controlli)
    - cron: "7,37 0 * * 6,0,1"       # sabato-lunedi: 01:07 e 01:37 ora italiana (2 controlli, fine serata)
    - cron: "7 5 * * *"              # ogni giorno alle 06:07 ora italiana: regionali finiti e nuovi
    # Per coprire anche il GIORNO (regionali europei dal vivo) togli il # alla riga qui sotto:
    # - cron: "7,37 7-16 * * 5,6,0"  # 08:07 - 17:37 ora italiana
permissions:
  contents: write
concurrency:
  group: vgc-stats
  cancel-in-progress: false
jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODO: ${{ inputs.modo || 'auto' }}
      TORNEO: ${{ inputs.id }}
      SALVA: ${{ github.event_name == 'schedule' && 'si' || inputs.salva }}
    steps:
      - uses: actions/checkout@v4
      - name: Raccolta
        run: |
          W=""
          [ "$SALVA" = "si" ] && W="--write"
          case "$MODO" in
            elenco) python3 -u vgc_stats.py --list $W ;;
            evento) python3 -u vgc_stats.py --id "$TORNEO" $W ;;
            *)      python3 -u vgc_stats.py --auto $W ;;
          esac
      - name: Salva i file nella repo
        if: ${{ always() && (github.event_name == 'schedule' || inputs.salva == 'si') }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          [ -d vgcstats ] && git add -A vgcstats
          git diff --staged --quiet || (git commit -m "VGC Stats: aggiornamento dati" && git pull --rebase && git push)
