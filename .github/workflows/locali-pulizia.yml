name: Locali - pulizia dei vecchi report
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: locali-pulizia
  cancel-in-progress: false
jobs:
  pulizia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u locali_pulizia.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for f in locali.json annunci.json; do [ -f "$f" ] && git add "$f"; done
          [ -d img/annunci ] && git add -A img/annunci
          git diff --staged --quiet || (git commit -m "Locali: tolti i report scaduti" && git pull --rebase && git push)
