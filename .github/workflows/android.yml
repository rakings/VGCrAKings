name: App Android - crea l'APK
# Parte DA SOLO quando carichi o cambi qualcosa nella cartella «android» (e si puo' avviare anche a mano).
# Crea l'app e la mette nella pagina «Releases» della repo: rAKings-VGC.apk, da scaricare e installare sul telefono.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Crea l'APK
        working-directory: android
        env:
          VERSIONE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Pubblica in Releases (sostituisce la versione di prova precedente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rAKings-VGC.apk
          gh release delete app-prova --yes --cleanup-tag 2>/dev/null || true
          gh release create app-prova rAKings-VGC.apk --prerelease \
            --title "App Android (prova) · versione ${{ github.run_number }}" \
            --notes "App di prova con i widget Tornei, CP bar e Bacheca. Scarica rAKings-VGC.apk dal telefono e installala."
