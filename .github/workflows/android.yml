name: App Android - crea l'APK
# Parte DA SOLO quando carichi o cambi qualcosa nella cartella «android» (e si puo' avviare anche a mano).
# Crea l'app firmata con la chiave segreta e la mette in «Releases»: rAKings-VGC.apk (link diretto sempre uguale).
# Poi scrive app_versione.json: il sito lo legge per avvisare chi ha l'app vecchia che c'e' una nuova versione.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Controlla la chiave segreta
        env:
          CHIAVE_B64: ${{ secrets.APP_CHIAVE }}
          CHIAVE_PASSWORD: ${{ secrets.APP_CHIAVE_PASSWORD }}
        run: |
          if [ -z "$CHIAVE_B64" ] || [ -z "$CHIAVE_PASSWORD" ]; then
            echo "::error::Mancano i segreti APP_CHIAVE e APP_CHIAVE_PASSWORD (Settings > Secrets and variables > Actions). Senza chiave segreta l'app non viene creata."
            exit 1
          fi
          echo "$CHIAVE_B64" | base64 -d > "$RUNNER_TEMP/rakings.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Crea l'APK
        working-directory: android
        env:
          VERSIONE: ${{ github.run_number }}
          CHIAVE_FILE: ${{ runner.temp }}/rakings.jks
          CHIAVE_PASSWORD: ${{ secrets.APP_CHIAVE_PASSWORD }}
          CHIAVE_ALIAS: rakings
        # due giri: l'APK per il sito (src=apk) e il pacchetto per il Play Store (src=play), cosi' il sito sa da dove arriva l'app
        run: |
          FONTE=apk gradle assembleRelease --no-daemon
          FONTE=play gradle bundleRelease --no-daemon
      - name: Pubblica in Releases (sostituisce la versione precedente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rAKings-VGC.apk
          cp android/app/build/outputs/bundle/release/app-release.aab rAKings-VGC-PlayStore.aab
          gh release delete app-prova --yes --cleanup-tag 2>/dev/null || true
          gh release create app-prova rAKings-VGC.apk rAKings-VGC-PlayStore.aab --prerelease \
            --title "App Android · versione ${{ github.run_number }}" \
            --notes "App rAKings VGC con i widget Tornei, CP bar, Bacheca, Top 8 dei locali e Top usage. Telefono: scarica rAKings-VGC.apk e installala. Play Store: carica rAKings-VGC-PlayStore.aab in Play Console."
      - name: Scrive la versione per l'avviso nel sito
        run: |
          rm -f rAKings-VGC.apk rAKings-VGC-PlayStore.aab
          echo "{\"v\":${{ github.run_number }},\"d\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"u\":\"https://github.com/rakings/VGCrAKings/releases/download/app-prova/rAKings-VGC.apk\"}" > app_versione.json
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add app_versione.json
          if ! git diff --staged --quiet; then
            git commit -m "App Android: versione ${{ github.run_number }}"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 6
            done
          fi
