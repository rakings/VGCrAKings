plugins { id 'com.android.application' }

// Numero di versione: lo mette il flusso di GitHub (ogni build ha un numero piu' alto)
def versione = (System.getenv('VERSIONE') ?: '1') as int
// da dove arriva l'app: apk (scaricata dal sito) o play (Play Store). Il flusso crea l'APK con apk e il pacchetto per il Play Store con play.
def fonte = (System.getenv('FONTE') ?: 'apk')
// Chiave dell'app: arriva SOLO dai segreti di GitHub (mai nella repo)
def chiaveFile = System.getenv('CHIAVE_FILE')

android {
    namespace 'com.rakings.vgc'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rakings.vgc'
        minSdk 23
        targetSdk 36
        versionCode versione
        versionName '1.0.' + versione
        // l'app apre il sito dicendo «sono l'app» e la sua versione (per l'avviso «nuova versione disponibile»)
        manifestPlaceholders = [versione: versione, fonte: fonte]
    }
    signingConfigs {
        rilascio {
            if (chiaveFile) {
                storeFile file(chiaveFile)
                storePassword System.getenv('CHIAVE_PASSWORD')
                keyAlias System.getenv('CHIAVE_ALIAS')
                keyPassword System.getenv('CHIAVE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (chiaveFile) signingConfig signingConfigs.rilascio
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
