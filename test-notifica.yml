name: Notifica di prova
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_notifica.py
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
